name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Check the tag is a semantic version
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be semantic versions like 1.2.3 or 1.2.3-beta.1, got '$VERSION'." >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 999 || patch > 999 )); then
            echo "Minor and patch must be below 1000 to fit the Android version code." >&2
            exit 1
          fi
          echo "VERSION_CODE=$(( major * 1000000 + minor * 1000 + patch ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Test
        run: |
          (cd relay && go test ./...)
          ./gradlew :app:testDebugUnitTest

      - name: Build relay
        working-directory: relay
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/cmux-relay ./cmd/cmux-relay
            tar -C dist -czf "dist/cmux-relay-${VERSION}-darwin-${arch}.tar.gz" cmux-relay
            rm dist/cmux-relay
          done

      - name: Build signed APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "Set the SIGNING_* secrets and the SIGNING_KEY_ALIAS variable to publish a signed APK." >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew :app:assembleRelease \
            -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
          rm "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/release/app-release.apk "relay/dist/cmux-android-${VERSION}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "relay/dist/cmux-android-${VERSION}-mapping.txt"

      - name: Checksums
        working-directory: relay/dist
        run: shasum -a 256 * > SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" relay/dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Get a token for the Homebrew tap
        id: tap-token
        if: ${{ !github.event.release.prerelease }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: gantoine
          repositories: homebrew-tap
          permission-contents: write

      - name: Update the Homebrew tap
        if: ${{ !github.event.release.prerelease }}
        env:
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/gantoine/homebrew-tap.git" "$RUNNER_TEMP/tap"
          bot_id=$(GH_TOKEN="$TAP_TOKEN" gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)

          arm64_sha=$(shasum -a 256 "relay/dist/cmux-relay-${VERSION}-darwin-arm64.tar.gz" | cut -d' ' -f1)
          amd64_sha=$(shasum -a 256 "relay/dist/cmux-relay-${VERSION}-darwin-amd64.tar.gz" | cut -d' ' -f1)
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          packaging/homebrew/render-formula.sh "$VERSION" "$arm64_sha" "$amd64_sha" > "$RUNNER_TEMP/tap/Formula/cmux-relay.rb"

          cd "$RUNNER_TEMP/tap"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Formula/cmux-relay.rb
          if git diff --cached --quiet; then
            echo "The formula is already at ${VERSION}."
          else
            git commit -m "cmux-relay ${VERSION}"
            git push origin HEAD:main
          fi
